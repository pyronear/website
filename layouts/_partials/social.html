{{- /* Link previews (Open Graph, X/Twitter): every page shares site.Params.images; context: dict "page" "title" "description" */ -}}
{{- $image := index site.Params.images 0 | absURL -}}
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .page.Permalink }}">
<meta property="og:title" content="{{ .title }}">
<meta property="og:description" content="{{ .description }}">
<meta property="og:locale" content="{{ replace .page.Language.Locale "-" "_" }}">
{{- range .page.Translations }}
<meta property="og:locale:alternate" content="{{ replace .Language.Locale "-" "_" }}">
{{- end }}
<meta property="og:image" content="{{ $image }}">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ i18n "shareImageAlt" }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .title }}">
<meta name="twitter:description" content="{{ .description }}">
<meta name="twitter:image" content="{{ $image }}">
<meta name="twitter:image:alt" content="{{ i18n "shareImageAlt" }}">
