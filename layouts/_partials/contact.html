{{- $js := resources.Get "js/form.js" | minify | fingerprint -}}
<section class="band band--dark" id="contact-form">
  <div class="container container--narrow">
    <h2>{{ .Params.contactForm.title }}</h2>
    <form class="form" method="POST" action="{{ site.Params.formAction }}" data-captcha-error="{{ i18n "captchaError" }}" data-send-error="{{ i18n "sendError" }}">
      <div class="form__honeypot" aria-hidden="true">
        <label for="honeypot">Leave this field empty</label>
        <input type="text" id="honeypot" name="honeypot" tabindex="-1" autocomplete="off">
      </div>
      <label for="email">{{ i18n "emailLabel" }}</label>
      <input type="email" id="email" name="email" aria-describedby="email-help" autocomplete="email">
      <small id="email-help">{{ i18n "emailPrivacy" }}</small>
      <label for="subject">{{ i18n "subjectLabel" }}</label>
      <input type="text" id="subject" name="subject">
      <label for="message">{{ i18n "messageLabel" }}</label>
      <textarea id="message" name="message" rows="4"></textarea>
      <label for="captcha">{{ i18n "captchaLabel" }}</label>
      <input type="text" id="captcha" name="captcha" inputmode="numeric" required>
      <p class="form__error" role="alert" hidden></p>
      <button class="btn btn--accent" type="submit">{{ i18n "submit" }}</button>
      <p class="form__thanks" role="status" hidden>✅ {{ i18n "sentTitle" }}<br>{{ i18n "sentSubtitle" }}</p>
    </form>
  </div>
</section>
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
