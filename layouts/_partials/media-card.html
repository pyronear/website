<a class="media-card" href="{{ .url }}" target="_blank" rel="noopener">
  <span class="media-card__img"><img src="{{ .image }}" alt="" loading="lazy"></span>
  <span class="media-card__meta">
    <img src="{{ .logo | relURL }}" alt="" loading="lazy">
    {{ .outlet }}{{ with .date }}, <time>{{ . }}</time>{{ end }}
  </span>
  <h3>{{ .title }}</h3>
</a>
