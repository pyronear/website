{{- with .Params.about -}}
<section class="section" id="about">
  <div class="container">
    <h2>{{ .title }}</h2>
    <p class="intro">{{ .intro | safeHTML }}</p>
    <div class="cards">
      {{- range .cards }}
      <article class="card">
        <img src="{{ .icon | relURL }}" alt="" width="40" height="40">
        <h3>{{ .title }}</h3>
        <p>{{ .text }}</p>
      </article>
      {{- end }}
    </div>
  </div>
</section>
{{- end -}}
