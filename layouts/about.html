{{ define "main" }}
  {{ partial "page-header.html" . }}
  <section class="section">
    <div class="container container--prose prose">{{ .Content }}</div>
  </section>
  <section class="section section--alt">
    <div class="container">
      <h2>{{ i18n "keyFigures" }}</h2>
      {{ partial "figures.html" . }}
    </div>
  </section>
  {{- with .Params.values }}
  <section class="section" id="values">
    <div class="container">
      <h2>{{ .title }}</h2>
      <div class="cards">
        {{- range .cards }}
        <article class="card">
          <span class="card__icon" style="--icon: url('{{ .icon | relURL }}')"></span>
          <h3>{{ .title }}</h3>
          <p>{{ .text }}</p>
        </article>
        {{- end }}
      </div>
    </div>
  </section>
  {{- end }}
{{ end }}
