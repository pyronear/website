name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.166.0
  # sha256 of hugo_extended_${HUGO_VERSION}_linux-amd64.deb, update together with HUGO_VERSION
  HUGO_SHA256: 52b06555f739b1a08e04f5c31296e9bdf166a012e9b7e3137befc889dbc24db8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check contact backend
        working-directory: worker
        run: |
          node --test index.test.mjs
          npx --yes wrangler@4.143.0 deploy --dry-run
      - name: Install Hugo
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          echo "$HUGO_SHA256  $RUNNER_TEMP/hugo.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      # Other refs (pull requests) only check that the site builds
      - id: pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          HUGO_PARAMS_FORMACTION: ${{ vars.CONTACT_FORM_URL }}
          HUGO_PARAMS_TURNSTILESITEKEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            case "$HUGO_PARAMS_FORMACTION" in
              https://*/contact) ;;
              *) echo 'Set CONTACT_FORM_URL to the deployed Worker HTTPS /contact URL.' >&2; exit 1 ;;
            esac
            case "$HUGO_PARAMS_TURNSTILESITEKEY" in
              0x*) ;;
              *) echo 'Set TURNSTILE_SITE_KEY to the production widget sitekey.' >&2; exit 1 ;;
            esac
          fi
          hugo --gc --minify --panicOnWarning ${BASE_URL:+--baseURL "$BASE_URL/"}
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
