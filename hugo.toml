baseURL = "https://pyronear.org/"
title = "Pyronear"
defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false
disableKinds = ["taxonomy", "term", "section", "rss"]
enableRobotsTXT = true

[params]
  # Default social share image (Open Graph / Twitter cards)
  images = ["img/og.jpg"]
  # Set through HUGO_PARAMS_FORMACTION and HUGO_PARAMS_TURNSTILESITEKEY at build time.
  formAction = ""
  turnstileSiteKey = ""
  googleSiteVerification = "NRZ27lDopfjKH3Lx1eWvh6WczAGh0hgqVg0AtB-ZK6c"
  # icon: file name in assets/icons/
  social = [
    { name = "LinkedIn", url = "https://www.linkedin.com/company/pyronearfr", icon = "linkedin" },
    { name = "GitHub", url = "https://github.com/pyronear", icon = "github" },
    { name = "Hugging Face", url = "https://huggingface.co/pyronear", icon = "huggingface" },
  ]
  # Footer columns: a title (i18n key) and the pages it lists by path; "#contact" is the home page contact form
  footer = [
    { title = "footerSolution", pages = ["/how-it-works", "/deployments"] },
    { title = "footerAssociation", pages = ["/about", "/open-approach", "/news"] },
    { title = "footerAct", pages = ["/support", "#contact"] },
  ]

[languages]
  # label: the language in its own name, listed in the language menu; the menu button shows the locale code
  [languages.fr]
    label = "Français"
    locale = "fr-FR"
    weight = 1
  [languages.en]
    label = "English"
    locale = "en"
    weight = 2
  [languages.es]
    label = "Español"
    locale = "es"
    weight = 3
  # Catalan; the key keeps the historical /es-ct/ URL. UI strings are in i18n/ca.yaml (named after the locale; Hugo ignores i18n/es-ct.yaml)
  [languages.es-ct]
    label = "Català"
    locale = "ca"
    weight = 4

# youtube-nocookie.com for the embedded videos
[privacy.youTube]
  privacyEnhanced = true

# Shared page settings apply to every translation.
[[cascade]]
target = { kind = "page" }
build = { publishResources = false }

[[cascade]]
target = { path = "/how-it-works" }
menus = { main = { weight = 1 } }
layout = "how-it-works"

[[cascade]]
target = { path = "/deployments" }
menus = { main = { weight = 2 } }
layout = "deployments"

[[cascade]]
target = { path = "/support" }
menus = { main = { weight = 3 } }
layout = "support"

[[cascade]]
target = { path = "/news" }
layout = "news"

[[cascade]]
target = { path = "/about" }
menus = { main = { weight = 4 } }
layout = "about"
