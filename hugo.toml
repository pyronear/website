baseURL = "https://website.pyronear.org/"
title = "Pyronear"
defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false
disableKinds = ["taxonomy", "term", "section", "rss"]
enableRobotsTXT = true

[params]
  # Default social share image (Open Graph / Twitter cards)
  images = ["img/og.jpg"]
  # Set through HUGO_PARAMS_FORMACTION and HUGO_PARAMS_TURNSTILESITEKEY at build time.
  formAction = ""
  turnstileSiteKey = ""
  googleSiteVerification = "NRZ27lDopfjKH3Lx1eWvh6WczAGh0hgqVg0AtB-ZK6c"
  # icon: file name in assets/icons/
  social = [
    { name = "LinkedIn", url = "https://www.linkedin.com/company/pyronearfr", icon = "linkedin" },
    { name = "GitHub", url = "https://github.com/pyronear", icon = "github" },
    { name = "Hugging Face", url = "https://huggingface.co/pyronear", icon = "huggingface" },
    { name = "Facebook", url = "https://www.facebook.com/pyronear", icon = "facebook" },
  ]

[languages]
  [languages.fr]
    label = "FR"
    locale = "fr-FR"
    weight = 1
  [languages.en]
    label = "EN"
    locale = "en"
    weight = 2
  [languages.es]
    label = "ES"
    locale = "es"
    weight = 3
  # Catalan; the key keeps the historical /es-ct/ URL. UI strings are in i18n/ca.yaml (named after the locale; Hugo ignores i18n/es-ct.yaml)
  [languages.es-ct]
    label = "CA"
    locale = "ca"
    weight = 4

# youtube-nocookie.com for the embedded videos
[privacy.youTube]
  privacyEnhanced = true

# Shared page settings apply to every translation.
[[cascade]]
target = { kind = "page" }
build = { publishResources = false }

[[cascade]]
target = { path = "/about" }
menus = { main = { weight = 1 } }
layout = "about"

[[cascade]]
target = { path = "/how-it-works" }
menus = { main = { weight = 2 } }

[[cascade]]
target = { path = "/deployments" }
menus = { main = { weight = 3 } }
layout = "deployments"

[[cascade]]
target = { path = "/support" }
menus = { main = { weight = 4 } }
layout = "support"

[[cascade]]
target = { path = "/news" }
menus = { main = { weight = 5 } }
layout = "news"

[[cascade]]
target = { path = "/open-approach" }
menus = { main = { weight = 6 } }
