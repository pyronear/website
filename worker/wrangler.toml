name = "pyronear-contact"
account_id = "3c02cbaca55b87fc626a756dff91834b"
main = "index.mjs"
compatibility_date = "2026-09-28"
workers_dev = true
preview_urls = false

[vars]
ALLOWED_ORIGINS = "https://website.pyronear.org,https://pyronear.org"

[[send_email]]
name = "CONTACT_EMAIL"
destination_address = "inquiries@pyronear.org"

[[durable_objects.bindings]]
name = "CONTACT_DELIVERY"
class_name = "ContactDelivery"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ContactDelivery"]

[[ratelimits]]
name = "CONTACT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[observability]
enabled = true
